# Tray app for Ubuntu 20.04: Tauri 1 (WebKitGTK 4.0), same panel UI and shared logic as crates/tray.
# Its own workspace: Tauri 1 and Tauri 2 can't be in one build graph.
[package]
name = "litellm-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tauri = { version = "1", features = ["system-tray", "icon-png"] }
tauri-plugin-positioner = { version = "1", features = ["system-tray"] }
usage-core = { path = "../usage-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[features]
# Tauri 1's CLI turns this on for release builds (serves the UI from the bundle, not a dev server).
custom-protocol = ["tauri/custom-protocol"]
