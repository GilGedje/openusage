[workspace]
resolver = "3"
members = ["crates/usage-core", "crates/ccline", "crates/tray", "crates/sni-tray"]
# Tauri 1 tray for Ubuntu 20.04: its own workspace (Tauri 1 and 2 GTK/WebKit bindings can't share one build).
exclude = ["crates/tray-legacy"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
