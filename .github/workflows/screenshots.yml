name: Screenshots

# Runs the real tray app on a Windows machine with sample data (tools/ci/demo_state.py) and captures
# the screen in light and dark mode — for reviewing the Windows look without a Windows PC.
on:
  push:
    branches: [litellm-usage]
    paths: ["crates/tray/**", "crates/usage-core/**", "design/**", "tools/ci/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tray app
        run: cargo build --release -p litellm-usage-tray
      - name: Sample data (signed in, fresh numbers, no network needed)
        run: python tools/ci/demo_state.py "$env:APPDATA" "$env:LOCALAPPDATA"
      - name: Screenshots, light and dark
        shell: powershell   # Windows PowerShell 5.1: Add-Type below needs its default .NET references
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @'
          using System; using System.Collections.Generic; using System.Drawing; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static List<IntPtr> Of(uint pid) { var list = new List<IntPtr>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid) list.Add(h); return true; }, IntPtr.Zero); return list; }
            public static string Title(IntPtr h) { var s = new System.Text.StringBuilder(256); GetWindowText(h, s, 256); return s.ToString(); }
            public static void Capture(IntPtr h, string path) { RECT r; GetWindowRect(h, out r);
              int w = Math.Max(1, r.R - r.L), ht = Math.Max(1, r.B - r.T);
              using (var bmp = new Bitmap(w, ht)) using (var g = Graphics.FromImage(bmp)) {
                var dc = g.GetHdc(); PrintWindow(h, dc, 2); g.ReleaseHdc(dc); bmp.Save(path); } }
          }
          '@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force shots | Out-Null
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $shell = New-Object -ComObject Shell.Application
          $theme = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Force -Path $theme | Out-Null
          foreach ($mode in @(@{n='light';v=1}, @{n='dark';v=0})) {
            Set-ItemProperty -Path $theme -Name AppsUseLightTheme -Value $mode.v -Type DWord
            Set-ItemProperty -Path $theme -Name SystemUsesLightTheme -Value $mode.v -Type DWord
            $shell.MinimizeAll()   # the runner's console window would cover the panel
            Start-Sleep -Seconds 2
            $env:LITELLM_USAGE_OPEN_PANEL = '1'
            $p = Start-Process -PassThru target\release\litellm-usage.exe
            Start-Sleep -Seconds 12
            if ($p.HasExited) { Write-Host "app exited with code $($p.ExitCode)" } else { Write-Host "app running (pid $($p.Id))" }
            Shot "windows-$($mode.n)"
            New-Item -ItemType Directory -Force shots | Out-Null
            foreach ($h in [Win]::Of([uint32]$p.Id)) {
              $r = New-Object Win+RECT; [void][Win]::GetWindowRect($h, [ref]$r)
              $t = [Win]::Title($h)
              Write-Host ("window '{0}' visible={1} rect=({2},{3})-({4},{5})" -f $t, [Win]::IsWindowVisible($h), $r.L, $r.T, $r.R, $r.B)
              if ($t -like 'Quota*') { [Win]::Capture($h, "$PWD\shots\panel-$($mode.n).png") }
            }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
      - name: App log
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\litellm-usage\error.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shots/*.png
          if-no-files-found: error
