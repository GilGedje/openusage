name: Bundles

# Builds the offline install bundles. Runs on version tags, manually, and on the working branch so
# every push has downloadable bundles under the run's artifacts.
on:
  push:
    branches: [litellm-usage]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        # Build on the oldest supported Ubuntu so the binaries run on 22.04 and newer.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux libraries for the tray app (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Build ccline
        run: cargo build --release -p ccline
      - name: Build tray .deb
        working-directory: crates/tray
        run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - name: Assemble bundle
        run: |
          DEB=$(ls target/release/bundle/deb/*.deb | head -n 1)
          sh installer/linux/make-bundle.sh target/release/ccline "$DEB" dist
      - uses: actions/upload-artifact@v4
        with:
          name: litellm-usage-ubuntu-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
