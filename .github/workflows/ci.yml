name: CI

on:
  push:
    branches: [main, litellm-usage]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the tray app (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # ccline.exe with the Visual C++ runtime linked in, so it needs no vcruntime140.dll on the
      # machine (the tray already links it statically through Tauri).
      - name: Self-contained ccline.exe
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p ccline --target-dir target/static
      - uses: actions/upload-artifact@v4
        with:
          name: ccline-${{ matrix.os }}
          path: |
            target/release/ccline
            target/release/ccline.exe
            target/release/litellm-usage
            target/release/litellm-usage.exe
            target/static/release/ccline.exe
          if-no-files-found: error
