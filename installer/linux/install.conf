# LiteLLM Usage — installer settings.
# Edit this file once, before handing the bundle to your users. install.sh refuses to run while
# the placeholder addresses below are still in place.

# Your LiteLLM proxy (the same address Claude Code uses as ANTHROPIC_BASE_URL).
LITELLM_URL="https://litellm.example.internal"

# Your status page, opened by the tray's "Status" link. Leave empty ("") to hide the link.
STATUS_URL="https://status.example.internal"

# Install the tray app (needs sudo for the .deb package; its libraries come from your apt mirror).
INSTALL_TRAY="yes"

# Start the tray app automatically when the user logs in.
START_TRAY_AT_LOGIN="yes"

# Show usage in Claude Code's status line (edits ~/.claude/settings.json, keeping a backup).
SETUP_CLAUDE_STATUSLINE="yes"
