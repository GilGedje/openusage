# ccline (Claude Code status line) — installer settings.
# Edit once, before handing this folder to your users. install.sh refuses to run while the
# example address below is still in place.

# Your LiteLLM proxy (the same address Claude Code uses as ANTHROPIC_BASE_URL).
LITELLM_URL="https://litellm.example.internal"

# Show usage in Claude Code's status line (edits ~/.claude/settings.json, keeping a backup).
SETUP_CLAUDE_STATUSLINE="yes"

# Your organization's CA certificate, if LiteLLM uses an internal certificate (typical when
# air-gapped) and the machines don't already trust it. PEM file, one or more certificates.
#   - An absolute path (e.g. /usr/local/share/ca-certificates/company-ca.crt) is used in place, so
#     IT can update that file later.
#   - A file name without a path means a file you put in this folder; it's copied during install.
# Leave empty ("") to rely on the machine's system certificates only.
CA_CERT=""
